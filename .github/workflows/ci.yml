name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check app tests scripts --select F,E9
      - name: Tests (unit, integration, e2e, architecture lint)
        run: python -m pytest -q
      - name: Demo
        run: python scripts/run_demo.py
      - name: Evaluation demo
        run: python scripts/run_evaluation_demo.py
      - name: Research demo
        run: python scripts/run_research_demo.py
      - name: Visual demo
        run: python scripts/run_visual_demo.py
