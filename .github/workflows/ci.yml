name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: System packages (FFmpeg for video composition, DejaVu fonts for slide text and subtitles)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
      - name: Install
        run: pip install -e ".[dev,providers]"
      - name: Lint
        run: ruff check app tests scripts --select F,E9
      - name: Tests (unit, integration, e2e, architecture lint)
        run: python -m pytest -q
      - name: Demo
        run: python scripts/run_demo.py
      - name: Evaluation demo
        run: python scripts/run_evaluation_demo.py
      - name: Research demo
        run: python scripts/run_research_demo.py
      - name: Visual demo
        run: python scripts/run_visual_demo.py
      - name: Presentation demo
        run: python scripts/run_presentation_demo.py
      - name: Audio demo
        run: python scripts/run_audio_demo.py
      - name: Video demo
        run: python scripts/run_video_demo.py
      - name: Provider demo (offline, mock providers, no credentials)
        run: python scripts/run_provider_demo.py --smoke
      - name: Production demo dry run (offline, checks configuration, calls nothing)
        run: python scripts/run_production_demo.py --dry-run
      - name: Adaptive demo (the next recommendation must change with the learner's mastery)
        run: python scripts/run_adaptive_demo.py
      - name: Generative video demo (mock video provider, real FFmpeg normaliser and composer)
        run: python scripts/run_generative_video_demo.py
      - name: Production dry run with generated video (offline, calls nothing)
        run: python scripts/run_production_demo.py --dry-run --generated-video
      - name: Curriculum demo (goal -> curriculum -> next action -> lesson -> evaluation -> progress -> completion)
        run: python scripts/run_curriculum_demo.py
      - name: Interactive demo (session -> adaptive turns -> hint -> grounded questions -> restart -> completion -> mastery)
        run: python scripts/run_interactive_demo.py
      - name: Assessment demo (exact -> rule -> semantic -> partial -> uncertain -> rubric -> mastery -> next action)
        run: python scripts/run_assessment_demo.py
      - name: Learning cycle demo (next action -> lesson -> WAITING -> restart -> session -> mastery -> next action -> COMPLETE)
        run: python scripts/run_learning_cycle_demo.py

  postgres:
    # The spend ledger's concurrency guarantees on PostgreSQL 16 (tests/postgres): races between threads and
    # processes, the lease fence, the in-flight key and the sweep. SQLite serializes writers and cannot detect a
    # regression to check-then-write; this job can. The database is a throwaway service with trust auth: no
    # credential exists to leak.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ta
          POSTGRES_DB: ta_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ta -d ta_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      TA_TEST_POSTGRES_URL: postgresql+psycopg://ta@localhost:5432/ta_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev,providers,postgres]"
      - name: Wait for PostgreSQL
        run: |
          python - <<'PY'
          import os, time
          import psycopg
          url = os.environ["TA_TEST_POSTGRES_URL"].replace("postgresql+psycopg://", "postgresql://")
          for attempt in range(60):
              try:
                  with psycopg.connect(url, connect_timeout=2) as conn:
                      conn.execute("SELECT 1")
                  print("PostgreSQL is ready")
                  break
              except psycopg.OperationalError:
                  time.sleep(1)
          else:
              raise SystemExit("PostgreSQL did not become ready")
          PY
      - name: PostgreSQL spend ledger tests (must run, not skip)
        run: |
          set -o pipefail
          python -m pytest -q -rs tests/postgres | tee pg-tests.log
          if grep -qi "skipped" pg-tests.log; then echo "tests/postgres was skipped"; exit 1; fi
